services:
  postgres:
    image: postgres:14
    container_name: arara-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: arara
      POSTGRES_PASSWORD: arara
      POSTGRES_DB: arara
    ports:
      - "5433:5432"
    volumes:
      - arara-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arara -d arara"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - arara-network

  redis:
    image: redis:6
    container_name: arara-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - arara-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - arara-network

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: arara-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - arara-prometheus-data:/prometheus
    extra_hosts:
      # host.docker.internal já existe por padrão no Docker Desktop
      # (Windows/Mac); isso só é necessário no Docker Engine puro (Linux)
      - "host.docker.internal:host-gateway"
    networks:
      - arara-network

  grafana:
    image: grafana/grafana:11.3.1
    container_name: arara-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/etc/grafana/dashboards:ro
      - arara-grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - arara-network

networks:
  arara-network:
    driver: bridge

volumes:
  arara-postgres-data:
  arara-redis-data:
  arara-prometheus-data:
  arara-grafana-data:
