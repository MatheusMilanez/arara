name: CI

# pull_request (nunca pull_request_target): PR de fork roda com o token e os
# secrets do PR, não do repositório-base. pull_request_target faria o oposto —
# daria a um workflow disparado por PR de estranho acesso a secrets do
# repositório. Não trocar isso sem entender essa diferença (ARARA-803).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# mínimo necessário pros dois jobs (só leem código e rodam testes) — qualquer
# workflow que precise de mais (ex: abrir issue, no ARARA-822) declara o
# próprio permissions, não herda daqui
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # Postgres is provisioned per-test via testcontainers; Redis isn't, so
      # it needs a real instance here (health check hits it directly).
      redis:
        image: redis:6
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      # só dependências de produção: o testcontainers (dev-only) tem
      # vulnerabilidades conhecidas sem fix ainda, sem risco pro que vai
      # pra produção — não faz sentido travar o CI por causa delas
      - run: npm run audit
      - run: npm test -- --coverage

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      # LayoutProps/PageProps são tipos gerados pelo Next (next dev/build/
      # typegen) — sem isso, tsc --noEmit falha do zero achando que o tipo
      # não existe (só existia localmente porque o build já tinha rodado)
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build
