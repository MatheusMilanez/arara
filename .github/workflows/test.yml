name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # Postgres is provisioned per-test via testcontainers; Redis isn't, so
      # it needs a real instance here (health check hits it directly).
      redis:
        image: redis:6
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      # só dependências de produção: o testcontainers (dev-only) tem
      # vulnerabilidades conhecidas sem fix ainda, sem risco pro que vai
      # pra produção — não faz sentido travar o CI por causa delas
      - run: npm run audit
      - run: npm test -- --coverage

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      # LayoutProps/PageProps são tipos gerados pelo Next (next dev/build/
      # typegen) — sem isso, tsc --noEmit falha do zero achando que o tipo
      # não existe (só existia localmente porque o build já tinha rodado)
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build
